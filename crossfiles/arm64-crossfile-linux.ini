[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'arm64-v8a'
endian = 'little'

[binaries]
# 默认使用毕昇编译器 (/sdk/bisheng -> hms/native/BiSheng)
# 如需回退开源 LLVM, 将 /sdk/bisheng 链接改为指向 /sdk/linux/native/llvm
c = '/sdk/bisheng/bin/clang'
cpp = '/sdk/bisheng/bin/clang++'
ar = '/sdk/bisheng/bin/llvm-ar'
strip = '/sdk/bisheng/bin/llvm-strip'
c_ld = '/sdk/bisheng/bin/ld.lld'
cpp_ld = '/sdk/bisheng/bin/ld.lld'
pkg-config = 'pkg-config'

[built-in options]
c_args = ['--target=aarch64-linux-ohos', '--sysroot=/sdk/linux/native/sysroot', '-fPIC', '-D__MUSL__=1', '-Wno-int-conversion']
cpp_args = ['--target=aarch64-linux-ohos', '--sysroot=/sdk/linux/native/sysroot', '-fPIC', '-D__MUSL__=1', '-Wno-int-conversion']
# 注意: 链接参数必须带 --sysroot, BiSheng clang 默认 sysroot 不是 OHOS 的,
# 缺少它会导致 ld.lld 找不到 crti.o / crtn.o / libc
c_link_args = ['--target=aarch64-linux-ohos', '--sysroot=/sdk/linux/native/sysroot', '-fuse-ld=lld', '-lc++_shared']
cpp_link_args = ['--target=aarch64-linux-ohos', '--sysroot=/sdk/linux/native/sysroot', '-fuse-ld=lld', '-lc++_shared']
buildtype = 'release'
default_library = 'static'
wrap_mode = 'nodownload'
