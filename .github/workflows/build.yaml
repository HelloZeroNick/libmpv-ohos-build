name: build libmpv for ohos

on:
  pull_request:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
      release:
        description: 'Create a GitHub release'
        required: true
        type: boolean
        default: false
      lto:
        description: 'Enable LTO (-flto, 毕昇增强)'
        required: true
        type: boolean
        default: false
      pgo:
        description: 'PGO mode: off / instrument (插桩, 真机采集) / use (使用仓库 profiles/lib.profdata 优化)'
        required: true
        type: choice
        default: 'off'
        options:
          - off
          - instrument
          - use
      extra_opt:
        description: 'Enable extra compiler opts (fp opt, partial-inlining, tail-dup, Bsymbolic, inline-plt; BiSheng enhanced)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt install -y gperf
          pip3 install meson
        shell: bash

      - name: Prepare PGO profile (use mode)
        if: ${{ inputs.pgo == 'use' }}
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/profiles/lib.profdata" ]; then
            echo "仓库中不存在 profiles/lib.profdata, 请先提交 PGO profile 文件" >&2
            exit 1
          fi
          ls -lh "$GITHUB_WORKSPACE/profiles/lib.profdata"
        shell: bash

      - name: Bundle
        run: |
          sudo chmod +x *.sh */*.sh
          OPT=""
          if [ "${{ inputs.lto }}" = "true" ]; then OPT="$OPT LTO=1"; fi
          if [ "${{ inputs.pgo }}" = "instrument" ]; then OPT="$OPT PGO=instrument"; fi
          if [ "${{ inputs.pgo }}" = "use" ]; then OPT="$OPT PGO=use:$GITHUB_WORKSPACE/profiles/lib.profdata"; fi
          if [ "${{ inputs.extra_opt }}" = "true" ]; then OPT="$OPT EXTRA_OPT=1"; fi
          echo "Build options: $OPT"
          # shellcheck disable=SC2086
          env $OPT ./bundle.sh
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: |
            ./libmpv/arm64-build/*.zip

      - name: Prepare release
        if: ${{ github.event.inputs.release == 'true' }}
        run: |
          echo "RELEASE_TAG=$(date "+%Y%m%d")" >> $GITHUB_ENV
        shell: bash

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: ${{ github.event.inputs.release == 'true' }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: |
            **Workflow run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            ./libmpv/arm64-build/*.zip
